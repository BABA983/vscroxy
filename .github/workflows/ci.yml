name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    name: Linux · build, vet, test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # The UI tests lay out and draw text through GTK's Pango.
      - name: Install GTK
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk-3-0t64 libgl1
      - run: go build ./...
      - run: go vet ./...
      - run: go tool mygo vet .
      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal)" || { gofmt -l cmd internal; exit 1; }
      - run: go test ./...
      - name: Headless collection smoke test
        run: |
          go build -o bin/vscroxy-cli ./cmd/vscroxy-cli
          python3 -m http.server 8765 --bind 127.0.0.1 --directory docs/examples/ci >/tmp/vscroxy-ci-fixture.log 2>&1 &
          fixture=$!
          trap 'kill "$fixture"' EXIT
          for attempt in {1..50}; do
            if curl --fail --silent http://127.0.0.1:8765/health.json >/dev/null; then break; fi
            sleep 0.1
          done
          bin/vscroxy-cli run --var base_url=http://127.0.0.1:8765 \
            --report-json reports/run.json --report-junit reports/run.xml \
            docs/examples/ci/collection.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collection-run-reports
          path: reports/
          if-no-files-found: ignore
      # Reported, never blocking: see docs/architecture.md 3.11.
      - name: Benchmarks (100k requests)
        continue-on-error: true
        run: |
          go test -run '^$' -bench . -benchtime 10x ./internal/app | tee bench.txt
          { echo '### Benchmarks (100k requests)'; echo '```'; grep '^Benchmark' bench.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  compile:
    name: ${{ matrix.os }} · build, vet
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
