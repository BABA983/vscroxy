name: CI

on:
  # A push to a PR branch already fires pull_request, so both triggers would
  # duplicate every job for one commit. The extra macOS arm64 jobs sit in a
  # runner queue and starve the others: GitHub cancelled the push jobs with
  # "The job was not acquired by Runner of type hosted even after multiple
  # attempts", well before the 20-minute job timeout. Keep pushes to the
  # integration branches so post-merge CI still runs; PR branches run once
  # through pull_request.
  push:
    branches: [main, feat/mygo-app]
  pull_request:

concurrency:
  # New commits on a PR arrive as new pull_request events with the same
  # ref; key on the branch so they supersede each other instead of racing.
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    name: Linux · build, vet, test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # The UI tests lay out and draw text through GTK's Pango.
      - name: Install GTK
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk-3-0t64 libgl1
      - run: go build ./...
      - run: go vet ./...
      - run: go tool mygo vet .
      - name: Check the message catalogs
        run: go tool mygo i18n check .
      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal scripts)" || { gofmt -l cmd internal scripts; exit 1; }
      # Fails when a linked module or its license is missing from the notices.
      - name: Check third-party notices
        run: go run ./scripts/third-party-notices -check
      - run: go test ./...
      - name: Headless collection smoke test
        run: |
          go build -o bin/vscroxy-cli ./cmd/vscroxy-cli
          python3 -m http.server 8765 --bind 127.0.0.1 --directory docs/examples/ci >/tmp/vscroxy-ci-fixture.log 2>&1 &
          fixture=$!
          trap 'kill "$fixture"' EXIT
          for attempt in {1..50}; do
            if curl --fail --silent http://127.0.0.1:8765/health.json >/dev/null; then break; fi
            sleep 0.1
          done
          bin/vscroxy-cli run --var base_url=http://127.0.0.1:8765 \
            --report-json reports/run.json --report-junit reports/run.xml \
            docs/examples/ci/collection.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collection-run-reports
          path: reports/
          if-no-files-found: ignore
      # Reported, never blocking: see docs/architecture.md 3.11.
      - name: Benchmarks (100k requests)
        continue-on-error: true
        run: |
          go test -run '^$' -bench . -benchtime 10x ./internal/app | tee bench.txt
          { echo '### Benchmarks (100k requests)'; echo '```'; grep '^Benchmark' bench.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  compile:
    name: ${{ matrix.os }} · build, vet, control tests
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - name: Test native discovery security
        if: runner.os == 'Windows'
        run: go test ./internal/control
      - name: Test MCP protocol and stdio
        if: runner.os == 'Windows'
        run: go test ./internal/mcpserver ./cmd/vscroxy-mcp
      - name: Test Windows executable icons
        if: runner.os == 'Windows'
        run: go test ./internal/appicon
      - name: Test named pipes
        if: runner.os == 'Windows'
        run: go test ./internal/request -run 'NamedPipe' -timeout 60s
      - name: Test every package
        if: runner.os == 'macOS'
        run: go test ./...
