swagger: "2.0"
info:
  title: Pet Store
  version: "1.0"
host: petstore.example.com
basePath: /v1
schemes: [https, http]
consumes: [application/json]
produces: [application/json]
securityDefinitions:
  api_key:
    type: apiKey
    name: X-API-Key
    in: header
security:
  - api_key: []
paths:
  /pets:
    get:
      tags: [pets]
      summary: List pets
      parameters:
        - name: limit
          in: query
          required: true
          type: integer
      responses:
        "200":
          description: ok
    post:
      tags: [pets]
      summary: Create pet
      consumes: [application/xml]
      parameters:
        - name: pet
          in: body
          required: true
          schema:
            $ref: "#/definitions/Pet"
      responses:
        "201":
          description: created
  /pets/{petId}/photo:
    post:
      tags: [pets]
      parameters:
        - name: petId
          in: path
          required: true
          type: string
        - name: photo
          in: formData
          type: file
          required: true
      responses:
        "200":
          description: ok
definitions:
  Pet:
    type: object
    properties:
      name:
        type: string
