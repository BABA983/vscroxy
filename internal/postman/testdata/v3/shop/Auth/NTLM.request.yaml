$kind: http-request
name: NTLM
method: GET
url: '{{baseUrl}}/auth/ntlm'
auth:
  type: ntlm
  credentials:
    - key: username
      value: user
    - key: password
      value: pass
    - key: domain
      value: EXAMPLE
    - key: workstation
      value: PC
    - key: disableRetryRequest
      value: true
